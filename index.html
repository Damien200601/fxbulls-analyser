<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FX BULLS — AI Chart Analyser</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter','Helvetica Neue',sans-serif;background:#f0f4ff;color:#111827;min-height:100vh}
  button{cursor:pointer;font-family:inherit}
  pre{white-space:pre-wrap;word-break:break-all}

  .header{background:#fff;border-bottom:1px solid #dde3f0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(26,86,219,.08)}
  .logo-wrap{display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:baseline;gap:4px;font-size:18px;font-weight:800}
  .brand .fx{color:#111827}.brand .bulls{color:#1a56db}
  .sub{color:#6b7280;font-size:10px;font-weight:600;letter-spacing:.15em}
  .live-badge{background:#ecfdf5;border:1px solid #6ee7b7;border-radius:20px;padding:5px 12px;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:#059669;letter-spacing:.1em}
  .live-dot{width:6px;height:6px;border-radius:50%;background:#059669}

  .body{max-width:520px;margin:0 auto;padding:24px 16px 60px}

  /* Step indicator */
  .steps{display:flex;align-items:center;gap:0;margin-bottom:24px;background:#fff;border-radius:12px;padding:16px;border:1px solid #dde3f0}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
  .step:not(:last-child)::after{content:'';position:absolute;right:-50%;top:16px;width:100%;height:2px;background:#dde3f0;z-index:0}
  .step:not(:last-child).done::after{background:#1a56db}
  .step-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2px solid #dde3f0;background:#fff;color:#9ca3af;position:relative;z-index:1;transition:all .3s}
  .step.active .step-circle{border-color:#1a56db;background:#1a56db;color:#fff}
  .step.done .step-circle{border-color:#059669;background:#059669;color:#fff}
  .step-label{font-size:10px;font-weight:600;color:#9ca3af;letter-spacing:.05em;text-align:center}
  .step.active .step-label{color:#1a56db}
  .step.done .step-label{color:#059669}

  /* H4 zones memory bar */
  .zones-bar{background:#e8effe;border:1.5px solid rgba(26,86,219,.25);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .zones-bar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .zones-bar-title{font-size:11px;font-weight:800;color:#1a56db;letter-spacing:.1em;display:flex;align-items:center;gap:6px}
  .zones-bar-clear{font-size:11px;color:#dc2626;font-weight:600;background:none;border:none;padding:0;cursor:pointer}
  .zone-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;margin:3px;border:1px solid}
  .zone-pill.res{background:#fef2f2;border-color:#fca5a5;color:#dc2626}
  .zone-pill.sup{background:#ecfdf5;border-color:#6ee7b7;color:#059669}

  /* TF selector */
  .tf-section{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;border:1px solid #dde3f0}
  .tf-title{font-size:12px;font-weight:800;color:#111827;letter-spacing:.08em;margin-bottom:14px}
  .tf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .tf-btn{padding:10px 6px;border-radius:8px;font-size:12px;font-weight:700;border:1.5px solid #dde3f0;background:#f8faff;color:#6b7280;transition:all .2s;text-align:center}
  .tf-btn.selected{border-color:#1a56db;background:#1a56db;color:#fff}
  .tf-btn:hover:not(.selected){border-color:#1a56db;color:#1a56db}
  .tf-mode{display:flex;gap:8px}
  .tf-mode-btn{flex:1;padding:10px;border-radius:8px;font-size:11px;font-weight:700;border:1.5px solid #dde3f0;background:#f8faff;color:#6b7280;text-align:center;transition:all .2s}
  .tf-mode-btn.selected{border-color:#1a56db;background:#e8effe;color:#1a56db}
  .tf-mode-btn .mode-icon{font-size:18px;display:block;margin-bottom:4px}
  .tf-mode-btn .mode-label{font-size:10px;display:block}
  .tf-mode-btn .mode-desc{font-size:9px;color:#9ca3af;display:block;margin-top:2px}
  .tf-mode-btn.selected .mode-desc{color:#1a56db;opacity:.7}

  /* Upload */
  .upload-zone{background:#fff;border:2px dashed #dde3f0;border-radius:16px;padding:44px 24px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:0 2px 12px rgba(26,86,219,.05)}
  .upload-zone:hover,.upload-zone.drag{background:#e8effe;border-color:#1a56db}
  .upload-title{font-size:16px;font-weight:700;margin:14px 0 6px;color:#111827}
  .upload-sub{font-size:13px;color:#6b7280}
  .upload-hint{font-size:11px;color:#9ca3af;margin-top:6px}

  /* Preview */
  .preview-wrap{margin-bottom:16px}
  .preview-img{width:100%;display:block;max-height:260px;object-fit:contain;background:#000;border-radius:14px;border:1px solid #dde3f0}
  .btn-row{display:flex;gap:10px;margin-top:12px}
  .btn-change{flex:1;background:#fff;border:1.5px solid #dde3f0;color:#6b7280;border-radius:10px;padding:13px;font-size:13px;font-weight:700}
  .btn-analyse{flex:2;background:linear-gradient(135deg,#1a56db,#1340b5);border:none;color:#fff;border-radius:10px;padding:13px;font-size:14px;font-weight:800;letter-spacing:.08em;box-shadow:0 4px 16px rgba(26,86,219,.3)}
  .btn-analyse:disabled{opacity:.6;cursor:not-allowed}

  /* Spinner */
  .spinner-wrap{display:flex;flex-direction:column;align-items:center;padding:48px 0;gap:16px}
  .spinner{width:48px;height:48px;border-radius:50%;border:3px solid #dde3f0;border-top:3px solid #1a56db;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner-text{color:#6b7280;font-size:13px;font-weight:600;letter-spacing:.06em}

  /* Error */
  .error-box{background:#fef2f2;border:1px solid #fca5a5;border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .error-title{color:#dc2626;font-size:13px;font-weight:800;margin-bottom:6px}
  .error-msg{color:#dc2626;font-size:12px;opacity:.85;margin-bottom:10px}
  .raw-box{background:#fff8f8;border:1px solid #fca5a5;border-radius:8px;padding:10px;margin-top:8px}
  .raw-label{color:#6b7280;font-size:10px;font-weight:700;letter-spacing:.08em;margin-bottom:4px}
  .raw-pre{color:#7f1d1d;font-size:10px;max-height:150px;overflow-y:auto}
  .btn-retry{background:#dc2626;border:none;color:#fff;border-radius:8px;padding:10px 18px;font-size:12px;font-weight:700;margin-top:12px}

  /* Cards */
  .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid #dde3f0;box-shadow:0 2px 10px rgba(26,86,219,.04)}
  .section-hdr{font-size:11px;font-weight:800;letter-spacing:.1em;color:#111827;margin-bottom:14px;display:flex;align-items:center;gap:6px}

  /* Thumb */
  .thumb-wrap{background:#000;border-radius:12px;overflow:hidden;border:1px solid #dde3f0;position:relative;margin-bottom:14px}
  .thumb-img{width:100%;display:block;max-height:180px;object-fit:contain}
  .thumb-badge{position:absolute;top:8px;left:8px;display:flex;gap:6px}
  .badge-dark{background:rgba(0,0,0,.8);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:800;color:#fff}
  .badge-tf{background:rgba(0,0,0,.6);border-radius:6px;padding:3px 8px;font-size:11px;color:#ccc}
  .trend-badge{position:absolute;top:8px;right:8px;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:800;color:#fff}

  /* Quality */
  .quality-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;margin-bottom:14px;border:1.5px solid}
  .quality-a{background:#ecfdf5;border-color:#6ee7b7}
  .quality-b{background:#fffbeb;border-color:#fcd34d}
  .quality-c{background:#fef2f2;border-color:#fca5a5}
  .quality-badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}

  /* Bias */
  .bias-box{background:#e8effe;border:1.5px solid rgba(26,86,219,.2);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px}
  .bias-icon{width:30px;height:30px;border-radius:50%;background:#1a56db;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}

  /* Zones */
  .zone-item{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 12px;margin-bottom:8px;border-radius:8px}
  .zone-res{background:#fef2f2;border:1px solid #fca5a5}
  .zone-sup{background:#ecfdf5;border:1px solid #6ee7b7}
  .zone-dot{width:8px;height:8px;border-radius:50%;margin-right:8px;flex-shrink:0;margin-top:4px}
  .zone-prices{font-family:monospace;font-size:13px;font-weight:800;text-align:right}
  .zone-touches{font-size:10px;margin-top:2px;text-align:right}

  /* Scenarios */
  .scenario{border-radius:10px;padding:14px;margin-bottom:10px}
  .scenario.primary{background:#e8effe;border:1.5px solid rgba(26,86,219,.27);border-left:4px solid #1a56db}
  .scenario.alternate{background:#f8faff;border:1.5px solid #dde3f0;border-left:4px solid #9ca3af}
  .scenario-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
  .scenario-conf{background:#fff;border-radius:6px;padding:7px 10px;border:1px solid #dde3f0;font-size:11px;margin-bottom:6px}

  /* Confirmation box */
  .conf-box{background:#e8effe;border:1px solid rgba(26,86,219,.2);border-radius:10px;padding:14px;margin-bottom:14px}
  .conf-option{background:#fff;border-radius:8px;padding:12px;margin-bottom:8px;border:1px solid #dde3f0}
  .conf-option:last-child{margin-bottom:0}
  .conf-opt-label{font-size:10px;font-weight:800;color:#1a56db;letter-spacing:.08em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .conf-opt-text{font-size:12px;color:#111827;line-height:1.5}
  .conf-opt-benefit{font-size:11px;color:#059669;margin-top:4px;font-style:italic}

  /* Trade */
  .trade-inner{border:1.5px solid #dde3f0;border-radius:12px;padding:16px}
  .trade-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:#1a56db;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .dir-badge{border-radius:6px;padding:4px 12px;font-size:13px;font-weight:800}
  .dir-long{background:#ecfdf5;border:1.5px solid #6ee7b7;color:#059669}
  .dir-short{background:#fef2f2;border:1.5px solid #fca5a5;color:#dc2626}
  .trade-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .tg-entry{background:#f8faff;border-radius:8px;padding:12px;border:1px solid #dde3f0}
  .tg-sl{background:#fef2f2;border-radius:8px;padding:12px;border:1px solid #fca5a5}
  .tg-label{font-size:10px;font-weight:700;letter-spacing:.1em;margin-bottom:5px}
  .tg-val{font-family:monospace;font-size:17px;font-weight:800}
  .tp-row{display:flex;gap:8px;margin-bottom:10px}
  .tp-item{background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:8px;padding:10px;flex:1;text-align:center}
  .tp-num{color:#059669;font-size:10px;font-weight:700;margin-bottom:3px}
  .tp-price{color:#059669;font-family:monospace;font-size:13px;font-weight:800}
  .rr-badge{border-radius:6px;padding:5px 14px;display:flex;align-items:center;gap:8px;display:inline-flex}
  .rr-valid{background:#ecfdf5;border:1px solid #6ee7b7}
  .rr-invalid{background:#fef2f2;border:1px solid #fca5a5}
  .invalid-bar{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 12px;font-size:11px;margin-top:10px}

  /* Next step prompt */
  .next-step-box{background:linear-gradient(135deg,#1a56db,#1340b5);border-radius:14px;padding:20px;margin-bottom:14px;text-align:center;color:#fff}
  .next-step-title{font-size:14px;font-weight:800;margin-bottom:8px;letter-spacing:.05em}
  .next-step-sub{font-size:12px;opacity:.85;margin-bottom:16px;line-height:1.5}
  .btn-next-step{background:#fff;color:#1a56db;border:none;border-radius:10px;padding:12px 24px;font-size:13px;font-weight:800;letter-spacing:.06em}

  /* Warning */
  .warning-box{background:#fffbeb;border:1px solid rgba(217,119,6,.27);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;font-size:12px;font-weight:600;color:#d97706;line-height:1.6}
  .disclaimer{background:#f8faff;border-radius:10px;padding:12px 14px;border:1px solid #dde3f0;margin-bottom:14px;font-size:11px;color:#6b7280;line-height:1.7}
  .btn-new{width:100%;background:linear-gradient(135deg,#1a56db,#1340b5);border:none;color:#fff;border-radius:12px;padding:16px;font-size:14px;font-weight:800;letter-spacing:.1em;box-shadow:0 4px 20px rgba(26,86,219,.25)}
  .hidden{display:none!important}
</style>
</head>
<body>

<div class="header">
  <div class="logo-wrap">
    <svg width="36" height="36" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="18" fill="#1a56db"/>
      <path d="M10 24C10 18 14 14 18 14C22 14 26 18 26 24" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M14 14C12 10 9 10 9 10C9 10 10 13 12 14" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M22 14C24 10 27 10 27 10C27 10 26 13 24 14" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
      <circle cx="15.5" cy="17" r="1.5" fill="white"/>
      <circle cx="20.5" cy="17" r="1.5" fill="white"/>
    </svg>
    <div style="display:flex;flex-direction:column;gap:2px">
      <div class="brand"><span class="fx">FX</span><span class="bulls">BULLS</span></div>
      <div class="sub">AI CHART ANALYSER</div>
    </div>
  </div>
  <div class="live-badge"><div class="live-dot"></div>LIVE</div>
</div>

<div class="body">

  <!-- Step indicator -->
  <div class="steps" id="stepsBar">
    <div class="step active" id="step1Indicator">
      <div class="step-circle">1</div>
      <div class="step-label">H4 ZONES</div>
    </div>
    <div class="step" id="step2Indicator">
      <div class="step-circle">2</div>
      <div class="step-label">ENTRY</div>
    </div>
  </div>

  <!-- H4 zones memory bar (shown in step 2) -->
  <div class="zones-bar hidden" id="zonesBar">
    <div class="zones-bar-header">
      <div class="zones-bar-title">📌 H4 ZONES LOADED</div>
      <button class="zones-bar-clear" onclick="clearH4Zones()">✕ Clear & restart</button>
    </div>
    <div id="zonesPills"></div>
  </div>

  <!-- TF Selector -->
  <div class="tf-section" id="tfSection">
    <div class="tf-title">SELECT TIMEFRAME</div>
    <div class="tf-grid">
      <div class="tf-btn" onclick="selectTF(this,'1M')">1M</div>
      <div class="tf-btn" onclick="selectTF(this,'5M')">5M</div>
      <div class="tf-btn" onclick="selectTF(this,'15M')">15M</div>
      <div class="tf-btn" onclick="selectTF(this,'30M')">30M</div>
      <div class="tf-btn" onclick="selectTF(this,'1H')">1H</div>
      <div class="tf-btn" onclick="selectTF(this,'4H')">4H</div>
      <div class="tf-btn" onclick="selectTF(this,'D1')">D1</div>
      <div class="tf-btn" onclick="selectTF(this,'W1')">W1</div>
    </div>
    <div class="tf-mode" id="tfModeRow" style="display:none">
      <button class="tf-mode-btn selected" id="modeZones" onclick="selectMode('zones')">
        <span class="mode-icon">🗺️</span>
        <span class="mode-label">MAP ZONES</span>
        <span class="mode-desc">Identify major S&R zones for the session</span>
      </button>
      <button class="tf-mode-btn" id="modeEntry" onclick="selectMode('entry')">
        <span class="mode-icon">🎯</span>
        <span class="mode-label">FIND ENTRY</span>
        <span class="mode-desc">Get precise entry using saved H4 zones</span>
      </button>
    </div>
  </div>

  <!-- Upload Zone -->
  <div class="upload-zone hidden" id="uploadZone">
    <svg width="48" height="48" viewBox="0 0 48 48" style="margin:0 auto;display:block">
      <circle cx="24" cy="24" r="24" fill="#e8effe"/>
      <path d="M24 14v20M24 14l-8 8M24 14l8 8" stroke="#1a56db" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="upload-title" id="uploadTitle">Upload H4 Chart</div>
    <div class="upload-sub" id="uploadSub">Drop a screenshot or tap to browse</div>
    <div class="upload-hint">TradingView · MT4 · MT5 · PNG · JPG</div>
    <div class="upload-hint" id="uploadRangeHint" style="color:#1a56db;font-weight:700;margin-top:4px"></div>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadFile(this.files[0])"/>
  </div>

  <!-- Preview -->
  <div class="preview-wrap hidden" id="previewWrap">
    <img id="previewImg" class="preview-img" alt="chart"/>
    <div class="btn-row">
      <button class="btn-change" onclick="resetUpload()">CHANGE</button>
      <button class="btn-analyse" id="btnAnalyse" onclick="analyse()">ANALYSE CHART</button>
    </div>
  </div>

  <!-- Spinner -->
  <div class="spinner-wrap hidden" id="spinnerWrap">
    <div class="spinner"></div>
    <div class="spinner-text" id="spinnerText">ANALYSING CHART...</div>
  </div>

  <!-- Error -->
  <div class="error-box hidden" id="errorBox">
    <div class="error-title">⚠ Analysis Failed</div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="raw-box hidden" id="rawBox">
      <div class="raw-label">RAW RESPONSE:</div>
      <pre class="raw-pre" id="rawPre"></pre>
    </div>
    <button class="btn-retry" onclick="retryAfterError()">TRY AGAIN</button>
  </div>

  <!-- Results -->
  <div id="results" class="hidden"></div>

</div>

<script>
// ── State ────────────────────────────────────────────────
let imageB64 = null, imageMime = 'image/png', currentImg = null;
let selectedTF = null, selectedMode = 'zones';
let h4Zones = null; // stored from step 1
let currentStep = 1; // 1 = zone mapping, 2 = entry finding

// ── Utils ────────────────────────────────────────────────
function detectMime(b64){
  try{
    const s=atob(b64.slice(0,12)),c=i=>s.charCodeAt(i);
    if(c(0)===0x89&&c(1)===0x50)return'image/png';
    if(c(0)===0xFF&&c(1)===0xD8)return'image/jpeg';
  }catch{}
  return'image/png';
}
function pullJSON(txt){
  const s=txt.indexOf('{'),e=txt.lastIndexOf('}');
  if(s<0||e<=s)return null;
  return JSON.parse(txt.slice(s,e+1));
}
const show=id=>document.getElementById(id).classList.remove('hidden');
const hide=id=>document.getElementById(id).classList.add('hidden');

// ── TF Selection ─────────────────────────────────────────
function selectTF(el, tf){
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  selectedTF = tf;

  // Show mode selector only for lower TFs when H4 zones exist
  const isHighTF = ['4H','D1','W1'].includes(tf);
  const isLowTF = ['1M','5M','15M','30M','1H'].includes(tf);

  if(isHighTF){
    // Force zone mapping mode
    selectedMode = 'zones';
    document.getElementById('tfModeRow').style.display = 'none';
    show('uploadZone');
    updateUploadText();
  } else if(isLowTF && h4Zones){
    // Show mode selector — they can choose entry or zone mapping
    document.getElementById('tfModeRow').style.display = 'flex';
    // Sync visual state to whatever selectedMode actually is, to avoid the
    // buttons showing a different mode than what will actually be sent
    document.getElementById('modeZones').classList.toggle('selected', selectedMode==='zones');
    document.getElementById('modeEntry').classList.toggle('selected', selectedMode==='entry');
    show('uploadZone');
    updateUploadText();
  } else {
    // No H4 zones saved yet — force zone mapping
    selectedMode = 'zones';
    document.getElementById('tfModeRow').style.display = 'none';
    show('uploadZone');
    updateUploadText();
  }
}

function selectMode(mode){
  selectedMode = mode;
  document.getElementById('modeZones').classList.toggle('selected', mode==='zones');
  document.getElementById('modeEntry').classList.toggle('selected', mode==='entry');
  updateUploadText();
}

function updateUploadText(){
  const isZoneMode = selectedMode === 'zones';
  const tf = selectedTF || '';
  document.getElementById('uploadTitle').textContent = isZoneMode
    ? `Upload ${tf} Chart — Map Zones`
    : `Upload ${tf} Chart — Find Entry`;
  document.getElementById('uploadSub').textContent = isZoneMode
    ? 'AI will identify major S&R zones for the session'
    : 'AI will find precise entries using your saved H4 zones';

  const idealRangeMap = {
    '1M':'2-4 hours','5M':'12-24 hours','15M':'2-3 days','30M':'3-5 days',
    '1H':'1-2 weeks','4H':'3-6 weeks','D1':'3-6 months','W1':'1-2 years'
  };
  const hintEl = document.getElementById('uploadRangeHint');
  if(tf && idealRangeMap[tf]){

// ── File loading ─────────────────────────────────────────
function loadFile(file){
  if(!file?.type.startsWith('image/')){showError('Please upload a PNG or JPG.');return;}
  const fr=new FileReader();
  fr.onload=e=>{
    const data=e.target.result;
    imageB64=data.split(',')[1];
    imageMime=detectMime(imageB64);
    currentImg=data;
    document.getElementById('previewImg').src=data;
    hide('uploadZone');show('previewWrap');hide('errorBox');hide('results');
  };
  fr.readAsDataURL(file);
}

function resetUpload(){
  imageB64=null;currentImg=null;
  document.getElementById('fileInput').value='';
  hide('previewWrap');show('uploadZone');hide('errorBox');hide('results');
}

// ── H4 Zone memory ────────────────────────────────────────
function saveH4Zones(zones){
  h4Zones = zones;
  renderZonesPills(zones);
  show('zonesBar');
  // Update step indicators
  document.getElementById('step1Indicator').classList.remove('active');
  document.getElementById('step1Indicator').classList.add('done');
  document.getElementById('step1Indicator').querySelector('.step-circle').textContent = '✓';
  document.getElementById('step2Indicator').classList.add('active');
  currentStep = 2;
}

function renderZonesPills(zones){
  const container = document.getElementById('zonesPills');
  container.innerHTML = (zones||[]).map(z => {
    const isRes = z.type === 'Resistance';
    const price = z.topBoundary ? `${z.bottomBoundary} – ${z.topBoundary}` : z.price || '';
    return `<span class="zone-pill ${isRes?'res':'sup'}">
      ${isRes?'▼':'▲'} ${z.type}: ${price}
    </span>`;
  }).join('');
}

function clearH4Zones(){
  h4Zones = null;
  hide('zonesBar');
  document.getElementById('step1Indicator').classList.add('active');
  document.getElementById('step1Indicator').classList.remove('done');
  document.getElementById('step1Indicator').querySelector('.step-circle').textContent = '1';
  document.getElementById('step2Indicator').classList.remove('active');
  currentStep = 1;
  // Reset TF selector
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('tfModeRow').style.display='none';
  selectedTF = null; selectedMode = 'zones';
  hide('uploadZone');hide('previewWrap');hide('results');hide('errorBox');
}

// ── Analyse ───────────────────────────────────────────────
async function analyse(){
  if(!imageB64||!selectedTF){
    if(!selectedTF){alert('Please select a timeframe first.');}
    return;
  }
  hide('errorBox');hide('results');hide('previewWrap');show('spinnerWrap');
  document.getElementById('spinnerText').textContent = selectedMode==='zones' ? 'MAPPING ZONES...' : 'FINDING ENTRY...';

  try{
    const res = await fetch('/api/analyse',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({imageBase64:imageB64, imageMime, prompt: buildPrompt()})
    });
    const data = await res.json();
    hide('spinnerWrap');show('previewWrap');
    if(!res.ok||data.error){showError(data.error||'Server error');return;}
    const txt = data.text||'';
    if(!txt){showError('Empty response');return;}
    let parsed;
    try{parsed=pullJSON(txt);}catch(e){showError('Parse error: '+e.message,txt);return;}
    if(!parsed){showError('No JSON in response',txt);return;}

    // If this was a zone mapping session, save the zones
    if(selectedMode==='zones'||['4H','D1','W1'].includes(selectedTF)){
      if(parsed.zones&&parsed.zones.length>0){
        saveH4Zones(parsed.zones);
      }
    }

    renderResults(parsed);
  }catch(e){
    hide('spinnerWrap');show('previewWrap');
    showError('Network error: '+e.message);
  }
}

function showError(msg,raw){
  document.getElementById('errorMsg').textContent=msg;
  if(raw){document.getElementById('rawPre').textContent=raw.slice(0,600);show('rawBox');}
  else hide('rawBox');
  show('errorBox');
}

function retryAfterError(){
  hide('errorBox');show('previewWrap');
}

            <div class="pulse-dot"></div>POSSIBLE TRADE IDEA
          </div>
          <div class="dir-badge ${isLong?'dir-long':'dir-short'}">${(r.trade.direction||'').toUpperCase()}</div>
        </div>
        ${r.trade.confirmation?`<div style="background:#e8effe;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:11px;border:1px solid rgba(26,86,219,.15)">
          <span style="color:#6b7280;font-weight:600">WAIT FOR CONFIRMATION: </span>
          <span style="color:#1a56db;font-weight:700">${r.trade.confirmation}</span>
        </div>`:''}
        <div class="trade-grid">
          <div class="tg-entry"><div class="tg-label" style="color:#6b7280">ENTRY</div><div class="tg-val" style="color:#111827">${r.trade.entry||''}</div></div>
          <div class="tg-sl"><div class="tg-label" style="color:#dc2626">STOP LOSS</div><div class="tg-val" style="color:#dc2626">${r.trade.sl||''}</div></div>
        </div>
        ${r.trade.slNote?`<div style="font-size:11px;color:#6b7280;margin-bottom:12px;font-style:italic">📌 ${r.trade.slNote}</div>`:''}
        ${tps?`<div style="font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.1em;margin-bottom:8px">TAKE PROFIT TARGETS</div>
        <div class="tp-row">${tps}</div>`:''}
        ${r.trade.tp1Note?`<div style="font-size:11px;color:#059669;margin-bottom:10px;font-style:italic">📐 ${r.trade.tp1Note}</div>`:''}
        ${r.trade.rr?`<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
          <div class="rr-badge ${rrValid?'rr-valid':'rr-invalid'}">
            <span style="color:#6b7280;font-size:11px;font-weight:600">R:R</span>
            <span style="font-family:monospace;font-size:14px;font-weight:800;color:${rrValid?'#059669':'#dc2626'}">${r.trade.rr} ${rrValid?'✓':'✗ SKIP'}</span>
          </div>
        </div>`:''}
        ${r.trade.invalidIf?`<div class="invalid-bar"><span style="color:#dc2626;font-weight:700">Setup cancelled if: </span><span style="color:#dc2626">${r.trade.invalidIf}</span></div>`:''}
      </div>
    </div>`:''}

    ${r.warning?`<div class="warning-box"><span>⚠️</span><span>${r.warning}</span></div>`:''}

    ${isZoneMode&&r.nextStep?`<div class="next-step-box">
      <div class="next-step-title">✅ ZONES SAVED — NEXT STEP</div>
      <div class="next-step-sub">${r.nextStep}</div>
      <button class="btn-next-step" onclick="goToEntryMode()">FIND ENTRY NOW →</button>
    </div>`:''}

    <div class="disclaimer"><strong>Risk Disclosure: </strong>Trading forex and leveraged products carries substantial risk. For educational purposes only. FX BULLS accepts no liability for trading decisions made using this tool.</div>
    <button class="btn-new" onclick="newAnalysis()">ANALYSE NEW CHART</button>`;

  hide('previewWrap');show('results');window.scrollTo(0,0);
}

function goToEntryMode(){
  // Reset upload but keep H4 zones
  imageB64=null;currentImg=null;
  document.getElementById('fileInput').value='';
  hide('results');
  // Auto-select entry mode
  selectedMode='entry';
  selectedTF=null;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('tfModeRow').style.display='none';
  hide('uploadZone');
  show('tfSection');
  window.scrollTo(0,0);
}

function newAnalysis(){
  // Keep H4 zones if they exist, just reset upload
  imageB64=null;currentImg=null;
  document.getElementById('fileInput').value='';
  hide('results');hide('errorBox');hide('previewWrap');
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('selected'));
  selectedTF=null;
  if(h4Zones){
    // Stay in entry mode, show TF selector with mode options
    document.getElementById('tfModeRow').style.display='flex';
    document.getElementById('modeZones').classList.toggle('selected', selectedMode==='zones');
    document.getElementById('modeEntry').classList.toggle('selected', selectedMode==='entry');
  } else {
    document.getElementById('tfModeRow').style.display='none';
  }
  hide('uploadZone');
  show('tfSection');
  window.scrollTo(0,0);
}

// File input via upload zone click
document.addEventListener('DOMContentLoaded',()=>{
  const zone = document.getElementById('uploadZone');
  zone.addEventListener('click',()=>document.getElementById('fileInput').click());
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag');loadFile(e.dataTransfer.files[0])});
});
</script>
</body>
</html>
