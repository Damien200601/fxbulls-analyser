<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FX BULLS — AI Chart Analyser</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter','Helvetica Neue',sans-serif;background:#f0f4ff;color:#111827;min-height:100vh}
  button{cursor:pointer;font-family:inherit}
  pre{white-space:pre-wrap;word-break:break-all}
  .header{background:#fff;border-bottom:1px solid #dde3f0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(26,86,219,.08)}
  .logo-wrap{display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:baseline;gap:4px;font-size:18px;font-weight:800}
  .brand .fx{color:#111827}.brand .bulls{color:#1a56db}
  .sub{color:#6b7280;font-size:10px;font-weight:600;letter-spacing:.15em}
  .live-badge{background:#ecfdf5;border:1px solid #6ee7b7;border-radius:20px;padding:5px 12px;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:#059669;letter-spacing:.1em}
  .live-dot{width:6px;height:6px;border-radius:50%;background:#059669}
  .body{max-width:520px;margin:0 auto;padding:24px 16px 60px}
  .upload-zone{background:#fff;border:2px dashed #dde3f0;border-radius:16px;padding:52px 24px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:0 2px 12px rgba(26,86,219,.05)}
  .upload-zone:hover,.upload-zone.drag{background:#e8effe;border-color:#1a56db}
  .upload-title{font-size:17px;font-weight:700;margin:18px 0 8px;color:#111827}
  .upload-sub{font-size:13px;color:#6b7280}
  .upload-hint{font-size:11px;color:#9ca3af;margin-top:8px}
  .preview-wrap{margin-bottom:20px}
  .preview-img{width:100%;display:block;max-height:300px;object-fit:contain;background:#000;border-radius:14px;border:1px solid #dde3f0}
  .btn-row{display:flex;gap:10px;margin-top:12px}
  .btn-change{flex:1;background:#fff;border:1.5px solid #dde3f0;color:#6b7280;border-radius:10px;padding:14px;font-size:13px;font-weight:700}
  .btn-analyse{flex:2;background:linear-gradient(135deg,#1a56db,#1340b5);border:none;color:#fff;border-radius:10px;padding:14px;font-size:14px;font-weight:800;letter-spacing:.08em;box-shadow:0 4px 16px rgba(26,86,219,.3)}
  .btn-analyse:disabled{opacity:.6;cursor:not-allowed}
  .spinner-wrap{display:flex;flex-direction:column;align-items:center;padding:48px 0;gap:16px}
  .spinner{width:48px;height:48px;border-radius:50%;border:3px solid #dde3f0;border-top:3px solid #1a56db;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner-text{color:#6b7280;font-size:13px;font-weight:600;letter-spacing:.06em}
  .error-box{background:#fef2f2;border:1px solid #fca5a5;border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .error-title{color:#dc2626;font-size:13px;font-weight:800;margin-bottom:6px}
  .error-msg{color:#dc2626;font-size:12px;opacity:.85;margin-bottom:10px}
  .raw-box{background:#fff8f8;border:1px solid #fca5a5;border-radius:8px;padding:10px;margin-top:8px}
  .raw-label{color:#6b7280;font-size:10px;font-weight:700;letter-spacing:.08em;margin-bottom:4px}
  .raw-pre{color:#7f1d1d;font-size:10px;max-height:150px;overflow-y:auto}
  .btn-retry{background:#dc2626;border:none;color:#fff;border-radius:8px;padding:10px 18px;font-size:12px;font-weight:700;margin-top:12px}
  .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;border:1px solid #dde3f0;box-shadow:0 2px 10px rgba(26,86,219,.04)}
  .section-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;font-weight:800;letter-spacing:.1em;color:#111827}
  .thumb-wrap{background:#000;border-radius:12px;overflow:hidden;border:1px solid #dde3f0;position:relative;margin-bottom:16px}
  .thumb-img{width:100%;display:block;max-height:190px;object-fit:contain}
  .thumb-badge{position:absolute;top:10px;left:10px;display:flex;gap:6px}
  .badge-dark{background:rgba(0,0,0,.75);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:800;color:#fff}
  .badge-tf{background:rgba(0,0,0,.55);border-radius:6px;padding:4px 10px;font-size:11px;color:#ccc}
  .trend-badge{position:absolute;top:10px;right:10px;border-radius:6px;padding:4px 10px;font-size:10px;font-weight:800;color:#fff}
  /* Quality score */
  .quality-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;margin-bottom:16px;border:1.5px solid}
  .quality-a{background:#ecfdf5;border-color:#6ee7b7}
  .quality-b{background:#fffbeb;border-color:#fcd34d}
  .quality-c{background:#fef2f2;border-color:#fca5a5}
  .quality-badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;flex-shrink:0}
  .quality-a .quality-badge{background:#059669;color:#fff}
  .quality-b .quality-badge{background:#d97706;color:#fff}
  .quality-c .quality-badge{background:#dc2626;color:#fff}
  .quality-label{font-size:10px;font-weight:800;letter-spacing:.1em;margin-bottom:3px}
  .quality-a .quality-label{color:#059669}
  .quality-b .quality-label{color:#d97706}
  .quality-c .quality-label{color:#dc2626}
  .quality-reason{font-size:12px;color:#374151}
  /* Setup type pill */
  .setup-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.08em;margin-bottom:4px;background:#e8effe;color:#1a56db;border:1px solid rgba(26,86,219,.2)}
  /* Bias */
  .bias-box{background:#e8effe;border:1.5px solid rgba(26,86,219,.2);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:12px}
  .bias-icon{width:32px;height:32px;border-radius:50%;background:#1a56db;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
  .bias-label{color:#1a56db;font-size:10px;font-weight:800;letter-spacing:.1em;margin-bottom:4px}
  .bias-text{color:#111827;font-size:13px;font-weight:600}
  .bias-note{color:#6b7280;font-size:12px;margin-top:4px}
  /* Levels */
  .level-item{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 14px;margin-bottom:8px;border-radius:8px}
  .level-res{background:#fef2f2;border:1px solid #fca5a5}
  .level-sup{background:#ecfdf5;border:1px solid #6ee7b7}
  .level-dot{width:8px;height:8px;border-radius:50%;margin-right:8px;flex-shrink:0;margin-top:3px}
  .level-left{display:flex;align-items:flex-start}
  .level-type-wrap{}
  .level-type{font-size:12px;font-weight:700}
  .level-strength{font-size:10px;color:#6b7280;margin-top:2px}
  .level-price{font-family:monospace;font-size:14px;font-weight:800;color:#111827;white-space:nowrap;margin-left:8px;margin-top:1px}
  /* Scenarios */
  .scenario{border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .scenario.primary{background:#e8effe;border:1.5px solid rgba(26,86,219,.27);border-left:4px solid #1a56db}
  .scenario.alternate{background:#f8faff;border:1.5px solid #dde3f0;border-left:4px solid #6b7280}
  .scenario-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .scenario-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
  .scenario-label{font-size:11px;font-weight:700;letter-spacing:.08em}
  .scenario-row{display:flex;justify-content:space-between;margin-bottom:6px}
  .scenario-lbl{color:#6b7280;font-size:12px}
  .scenario-val{font-family:monospace;font-size:14px;font-weight:800;color:#111827}
  .scenario-conf{background:#fff;border-radius:6px;padding:8px 10px;border:1px solid #dde3f0;font-size:11px;color:#111827;margin-bottom:6px}
  .scenario-conf span{color:#6b7280}
  .scenario-note{color:#6b7280;font-size:11px;font-style:italic}
  /* Trade card */
  .trade-inner{border:1.5px solid #dde3f0;border-radius:12px;padding:18px;box-shadow:0 2px 12px rgba(26,86,219,.06)}
  .trade-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .trade-label{display:flex;align-items:center;gap:8px;color:#1a56db;font-size:11px;font-weight:800;letter-spacing:.1em}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:#1a56db;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .dir-badge{border-radius:6px;padding:4px 12px;font-size:13px;font-weight:800}
  .dir-long{background:#ecfdf5;border:1.5px solid #6ee7b7;color:#059669}
  .dir-short{background:#fef2f2;border:1.5px solid #fca5a5;color:#dc2626}
  .conf-bar{background:#e8effe;border-radius:8px;padding:10px 14px;margin-bottom:14px;border:1px solid rgba(26,86,219,.13);font-size:11px}
  .conf-lbl{color:#6b7280;font-weight:600}
  .conf-val{color:#1a56db;font-weight:700}
  .trade-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tg-entry{background:#f8faff;border-radius:8px;padding:12px 14px;border:1px solid #dde3f0}
  .tg-sl{background:#fef2f2;border-radius:8px;padding:12px 14px;border:1px solid #fca5a5}
  .tg-label{font-size:10px;font-weight:700;letter-spacing:.1em;margin-bottom:6px}
  .tg-entry .tg-label{color:#6b7280}.tg-sl .tg-label{color:#dc2626}
  .tg-val{font-family:monospace;font-size:17px;font-weight:800}
  .tg-entry .tg-val{color:#111827}.tg-sl .tg-val{color:#dc2626}
  .tp-label{color:#6b7280;font-size:10px;font-weight:700;letter-spacing:.1em;margin-bottom:8px}
  .tp-row{display:flex;gap:8px;margin-bottom:12px}
  .tp-item{background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:8px;padding:10px 12px;flex:1;text-align:center}
  .tp-num{color:#059669;font-size:10px;font-weight:700;margin-bottom:4px}
  .tp-price{color:#059669;font-family:monospace;font-size:14px;font-weight:800}
  .rr-row{display:flex;justify-content:flex-end;margin-bottom:12px}
  .rr-badge{border-radius:6px;padding:5px 14px;display:flex;align-items:center;gap:6px}
  .rr-valid{background:#ecfdf5;border:1px solid #6ee7b7}
  .rr-invalid{background:#fef2f2;border:1px solid #fca5a5}
  .rr-lbl{color:#6b7280;font-size:11px;font-weight:600}
  .rr-val-good{color:#059669;font-family:monospace;font-size:14px;font-weight:800}
  .rr-val-bad{color:#dc2626;font-family:monospace;font-size:14px;font-weight:800}
  /* Invalidation */
  .invalid-bar{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;font-size:11px;color:#dc2626;margin-top:10px}
  .invalid-lbl{font-weight:700;margin-bottom:2px}
  /* Warning */
  .warning-box{background:#fffbeb;border:1px solid rgba(217,119,6,.27);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;font-size:12px;font-weight:600;color:#d97706;line-height:1.6}
  .disclaimer{background:#f8faff;border-radius:10px;padding:12px 16px;border:1px solid #dde3f0;margin-bottom:16px;font-size:11px;color:#6b7280;line-height:1.7}
  .disclaimer strong{color:#374151}
  .btn-new{width:100%;background:linear-gradient(135deg,#1a56db,#1340b5);border:none;color:#fff;border-radius:12px;padding:17px;font-size:14px;font-weight:800;letter-spacing:.1em;box-shadow:0 4px 20px rgba(26,86,219,.25)}
  .hidden{display:none!important}
</style>
</head>
<body>

<div class="header">
  <div class="logo-wrap">
    <svg width="38" height="38" viewBox="0 0 38 38">
      <circle cx="19" cy="19" r="19" fill="#1a56db"/>
      <path d="M11 25C11 19 15 15 19 15C23 15 27 19 27 25" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M15 15C13 11 10 11 10 11C10 11 11 14 13 15" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M23 15C25 11 28 11 28 11C28 11 27 14 25 15" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
      <circle cx="16.5" cy="18" r="1.5" fill="white"/>
      <circle cx="21.5" cy="18" r="1.5" fill="white"/>
    </svg>
    <div style="display:flex;flex-direction:column;gap:2px">
      <div class="brand"><span class="fx">FX</span><span class="bulls">BULLS</span></div>
      <div class="sub">AI CHART ANALYSER</div>
    </div>
  </div>
  <div class="live-badge"><div class="live-dot"></div>LIVE</div>
</div>

<div class="body">
  <div class="upload-zone" id="uploadZone">
    <svg width="52" height="52" viewBox="0 0 52 52" style="margin:0 auto;display:block">
      <circle cx="26" cy="26" r="26" fill="#e8effe"/>
      <path d="M26 16v20M26 16l-8 8M26 16l8 8" stroke="#1a56db" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="upload-title">Upload Your Chart</div>
    <div class="upload-sub">Drop a screenshot or tap to browse</div>
    <div class="upload-hint">Any forex pair · Any timeframe · PNG · JPG</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none"/>
  </div>

  <div class="preview-wrap hidden" id="previewWrap">
    <img id="previewImg" class="preview-img" alt="chart"/>
    <div class="btn-row">
      <button class="btn-change" id="btnChange">CHANGE</button>
      <button class="btn-analyse" id="btnAnalyse">ANALYSE CHART</button>
    </div>
  </div>

  <div class="spinner-wrap hidden" id="spinnerWrap">
    <div class="spinner"></div>
    <div class="spinner-text">ANALYSING CHART...</div>
  </div>

  <div class="error-box hidden" id="errorBox">
    <div class="error-title">⚠ Analysis Failed</div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="raw-box hidden" id="rawBox">
      <div class="raw-label">RAW RESPONSE:</div>
      <pre class="raw-pre" id="rawPre"></pre>
    </div>
    <button class="btn-retry" id="btnRetry">TRY AGAIN</button>
  </div>

  <div id="results" class="hidden"></div>
</div>

<script>
let imageB64=null, imageMime="image/png", currentImg=null;

function detectMime(b64){
  try{
    const s=atob(b64.slice(0,12)),c=i=>s.charCodeAt(i);
    if(c(0)===0x89&&c(1)===0x50)return"image/png";
    if(c(0)===0xFF&&c(1)===0xD8)return"image/jpeg";
    if(c(0)===0x47&&c(1)===0x49)return"image/gif";
    if(c(0)===0x52&&c(1)===0x49)return"image/webp";
  }catch{}
  return"image/png";
}

function pullJSON(txt){
  const s=txt.indexOf("{"),e=txt.lastIndexOf("}");
  if(s<0||e<=s)return null;
  return JSON.parse(txt.slice(s,e+1));
}

const show=id=>document.getElementById(id).classList.remove("hidden");
const hide=id=>document.getElementById(id).classList.add("hidden");

function loadFile(file){
  if(!file?.type.startsWith("image/")){showError("Please upload a PNG or JPG.");return;}
  const fr=new FileReader();
  fr.onload=e=>{
    const data=e.target.result;
    imageB64=data.split(",")[1];
    imageMime=detectMime(imageB64);
    currentImg=data;
    document.getElementById("previewImg").src=data;
    hide("uploadZone");show("previewWrap");hide("errorBox");hide("results");
  };
  fr.readAsDataURL(file);
}

function reset(){
  imageB64=null;currentImg=null;
  document.getElementById("fileInput").value="";
  show("uploadZone");hide("previewWrap");hide("errorBox");hide("results");hide("spinnerWrap");
}

function showError(msg,raw){
  document.getElementById("errorMsg").textContent=msg;
  if(raw){document.getElementById("rawPre").textContent=raw.slice(0,600);show("rawBox");}
  else hide("rawBox");
  show("errorBox");
}

async function analyse(){
  if(!imageB64)return;
  hide("errorBox");hide("results");hide("previewWrap");show("spinnerWrap");
  try{
    const res=await fetch("/api/analyse",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({imageBase64:imageB64,imageMime})
    });
    const data=await res.json();
    hide("spinnerWrap");show("previewWrap");
    if(!res.ok||data.error){showError(data.error||"Server error");return;}
    const txt=data.text||"";
    if(!txt){showError("Empty response");return;}
    let parsed;
    try{parsed=pullJSON(txt);}catch(e){showError("Parse error: "+e.message,txt);return;}
    if(!parsed){showError("No JSON in response",txt);return;}
    renderResults(parsed);
  }catch(e){
    hide("spinnerWrap");show("previewWrap");
    showError("Network error: "+e.message);
  }
}

function renderResults(r){
  const trendColor=r.trend==="UPTREND"?"#059669":r.trend==="DOWNTREND"?"#dc2626":"#d97706";
  const isLong=["LONG","BUY"].includes((r.trade?.direction||"").toUpperCase());
  const rrValid=r.trade?.rrValid!==false;
  const qScore=(r.qualityScore||"B").toUpperCase();
  const qClass=qScore==="A"?"quality-a":qScore==="C"?"quality-c":"quality-b";
  const qLabel=qScore==="A"?"A-GRADE SETUP":qScore==="C"?"C-GRADE — WEAK":"B-GRADE SETUP";

  const levels=(r.levels||[]).map(l=>{
    const res=l.type==="Resistance";
    return`<div class="level-item ${res?'level-res':'level-sup'}">
      <div class="level-left">
        <div class="level-dot" style="background:${res?'#dc2626':'#059669'}"></div>
        <div class="level-type-wrap">
          <div class="level-type" style="color:${res?'#dc2626':'#059669'}">${l.type.toUpperCase()}</div>
          ${l.strength?`<div class="level-strength">${l.strength}</div>`:''}
        </div>
      </div>
      <div class="level-price">${l.price}</div>
    </div>`;
  }).join("");

  const scenarios=(r.scenarios||[]).map((s,i)=>`
    <div class="scenario ${i===0?'primary':'alternate'}">
      <div class="scenario-hdr">
        <div class="scenario-num" style="background:${i===0?'#1a56db':'#6b7280'}">${s.number}</div>
        <span class="scenario-label" style="color:${i===0?'#1a56db':'#6b7280'}">SCENARIO ${s.number} — ${i===0?'PRIMARY':'ALTERNATE'}</span>
      </div>
      ${s.setupType?`<div><span class="setup-pill">${s.setupType}</span></div>`:''}
      <div class="scenario-row"><span class="scenario-lbl">Entry</span><span class="scenario-val">${s.entry}</span></div>
      <div class="scenario-conf"><span>Wait for: </span>${s.confirmation}</div>
      ${s.note?`<div class="scenario-note">${s.note}</div>`:''}
    </div>`).join("");

  const tps=(r.trade?.targets||[]).map((tp,i)=>`
    <div class="tp-item"><div class="tp-num">TP${i+1}</div><div class="tp-price">${tp}</div></div>`).join("");

  document.getElementById("results").innerHTML=`
    <div class="thumb-wrap">
      <img class="thumb-img" src="${currentImg}" alt="chart"/>
      <div class="thumb-badge">
        ${r.instrument?`<div class="badge-dark">${r.instrument}</div>`:''}
        ${r.timeframe?`<div class="badge-tf">${r.timeframe}</div>`:''}
      </div>
      ${r.trend?`<div class="trend-badge" style="background:${trendColor}">${r.trend}</div>`:''}
    </div>

    <!-- Quality Score -->
    <div class="quality-row ${qClass}">
      <div class="quality-badge">${qScore}</div>
      <div>
        <div class="quality-label">${qLabel}</div>
        ${r.qualityReason?`<div class="quality-reason">${r.qualityReason}</div>`:''}
      </div>
    </div>

    <!-- Bias -->
    ${r.bias?`<div class="bias-box">
      <div class="bias-icon">📊</div>
      <div>
        <div class="bias-label">MARKET BIAS</div>
        <div class="bias-text">${r.bias}</div>
        ${r.trendNote?`<div class="bias-note">${r.trendNote}</div>`:''}
      </div>
    </div>`:''}

    ${r.scenarios?.length?`<div class="card"><div class="section-hdr">🎯 SCENARIOS</div>${scenarios}</div>`:''}
    ${r.levels?.length?`<div class="card"><div class="section-hdr">📍 KEY LEVELS</div>${levels}</div>`:''}

    ${r.trade?`<div class="card">
      <div class="section-hdr">💼 TRADE SETUP</div>
      <div class="trade-inner">
        <div class="trade-top">
          <div class="trade-label"><div class="pulse-dot"></div>POSSIBLE TRADE IDEA</div>
          <div class="dir-badge ${isLong?'dir-long':'dir-short'}">${(r.trade.direction||'').toUpperCase()}</div>
        </div>
        ${r.trade.confirmation?`<div class="conf-bar"><span class="conf-lbl">WAIT FOR CONFIRMATION: </span><span class="conf-val">${r.trade.confirmation}</span></div>`:''}
        <div class="trade-grid">
          <div class="tg-entry"><div class="tg-label">ENTRY</div><div class="tg-val">${r.trade.entry||''}</div></div>
          <div class="tg-sl"><div class="tg-label">STOP LOSS</div><div class="tg-val">${r.trade.sl||''}</div></div>
        </div>
        ${tps?`<div class="tp-label">TAKE PROFIT TARGETS</div><div class="tp-row">${tps}</div>`:''}
        ${r.trade.rr?`<div class="rr-row"><div class="rr-badge ${rrValid?'rr-valid':'rr-invalid'}">
          <span class="rr-lbl">RISK:REWARD</span>
          <span class="${rrValid?'rr-val-good':'rr-val-bad'}">${r.trade.rr} ${rrValid?'✓':'✗ SKIP'}</span>
        </div></div>`:''}
        ${r.trade.invalidIf?`<div class="invalid-bar"><div class="invalid-lbl">❌ SETUP CANCELLED IF:</div>${r.trade.invalidIf}</div>`:''}
      </div>
    </div>`:''}

    ${r.warning?`<div class="warning-box"><span>⚠️</span><span>${r.warning}</span></div>`:''}

    <div class="disclaimer"><strong>Risk Disclosure: </strong>Trading forex and leveraged products carries substantial risk. This tool is for educational purposes only and does not constitute financial advice. FX BULLS accepts no liability for trading decisions made using this tool.</div>
    <button class="btn-new" onclick="reset()">ANALYSE NEW CHART</button>`;

  hide("previewWrap");show("results");window.scrollTo(0,0);
}

document.getElementById("uploadZone").addEventListener("click",()=>document.getElementById("fileInput").click());
document.getElementById("uploadZone").addEventListener("dragover",e=>{e.preventDefault();e.currentTarget.classList.add("drag")});
document.getElementById("uploadZone").addEventListener("dragleave",e=>e.currentTarget.classList.remove("drag"));
document.getElementById("uploadZone").addEventListener("drop",e=>{e.preventDefault();e.currentTarget.classList.remove("drag");loadFile(e.dataTransfer.files[0])});
document.getElementById("fileInput").addEventListener("change",e=>loadFile(e.target.files[0]));
document.getElementById("btnChange").addEventListener("click",reset);
document.getElementById("btnAnalyse").addEventListener("click",analyse);
document.getElementById("btnRetry").addEventListener("click",()=>{hide("errorBox");show("previewWrap")});
</script>
</body>
</html>
